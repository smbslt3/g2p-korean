name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  default:
    name: 기본 (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run --no-sync python -m pytest -q

  release-artifacts:
    name: 배포 산출물 (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - run: uv sync --dev --locked
      - name: 배포 릴리스 Kiwi.tokenize 호환성 확인
        run: |
          uv run --no-sync python - <<'PY'
          from kiwipiepy import Kiwi
          from g2p_ko.analyzer import KiwiAnalyzer

          parts = Kiwi().tokenize("했다")
          assert [(item.tag, item.start, item.len) for item in parts] == [
              ("VV", 0, 1),
              ("EP", 0, 1),
              ("EF", 1, 1),
          ]
          assert [(item.form, item.tag) for item in KiwiAnalyzer().analyze("했다")] == [
              ("했", "VV+EP"),
              ("다", "EF"),
          ]
          PY
      - name: 재현 빌드 SHA-256 비교
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --out-dir dist-a
          uv build --out-dir dist-b
          uv run --no-sync python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          def hashes(directory):
              return {
                  path.name: sha256(path.read_bytes()).hexdigest()
                  for path in Path(directory).iterdir()
                  if path.is_file()
              }

          first = hashes("dist-a")
          second = hashes("dist-b")
          assert first == second, (first, second)
          PY
      - run: uv run --no-sync python tools/check_artifacts.py dist-a/*.whl dist-a/*.tar.gz
      - name: sdist에 포함된 전체 테스트 실행
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          from tempfile import TemporaryDirectory

          with TemporaryDirectory() as directory:
              artifact = next(Path("dist-a").glob("*.tar.gz"))
              with tarfile.open(artifact, "r:gz") as archive:
                  archive.extractall(directory, filter="data")
              source_root = next(Path(directory).iterdir())
              assert (source_root / "tests/test_packaging.py").is_file()
              assert not (source_root / "tests/test_repository_policy.py").exists()
              environment = os.environ.copy()
              environment["PYTHONPATH"] = str(source_root / "src")
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q"],
                  cwd=source_root,
                  env=environment,
                  check=True,
              )
          PY
      - name: wheel 의존성 포함 새 환경 설치 확인
        run: |
          uv venv --python 3.13 .ci-runtime-venv
          uv pip install --python .ci-runtime-venv/bin/python dist-a/*.whl
          .ci-runtime-venv/bin/python - <<'PY'
          from kiwipiepy import Kiwi
          from g2p_ko import G2P

          assert Kiwi().tokenize("했다")
          result = G2P().convert("국물")
          assert result.normalized_text == "국물"
          assert result.surface_pronunciation == "궁물"
          PY
      - name: wheel 최소 설치 및 지연 import 확인
        run: |
          uv venv --python 3.13 .ci-wheel-venv
          uv pip install --python .ci-wheel-venv/bin/python --no-deps dist-a/*.whl
          .ci-wheel-venv/bin/python - <<'PY'
          from g2p_ko import G2P, KoreanTTSNormalizer, normalize_numbers

          assert KoreanTTSNormalizer()("사과 3개") == "사과 세 개"
          assert callable(G2P())
          assert normalize_numbers("사과 3개") == "사과 3개"
          assert G2P()("123") == "123"
          PY
      - name: sdist 최소 설치 및 지연 import 확인
        run: |
          uv venv --python 3.13 .ci-sdist-venv
          uv pip install --python .ci-sdist-venv/bin/python --no-deps dist-a/*.tar.gz
          .ci-sdist-venv/bin/python - <<'PY'
          from g2p_ko import G2P, KoreanTTSNormalizer, normalize_numbers

          assert KoreanTTSNormalizer()("사과 3개") == "사과 세 개"
          assert callable(G2P())
          assert normalize_numbers("사과 3개") == "사과 3개"
          assert G2P()("123") == "123"
          PY
